name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      # CI never sees a Discord token: everything runs against demo fixtures.
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Smoke test (boot demo, probe HTTP, graceful SIGTERM)
        run: npm run smoke
      - name: Slash command payload (dry run, no token)
        run: npm run register -- --dry-run > /dev/null

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: server-toolkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container in demo mode and probe /healthz
        run: |
          docker run -d --name toolkit -e DEMO_MODE=true -p 3000:3000 server-toolkit:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/healthz && exit 0; sleep 1; done
          docker logs toolkit; exit 1
